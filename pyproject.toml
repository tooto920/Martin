[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "martin"
version = "2.0.0"
description = "Martin 2.0 - osobni AI asistent pro Windows 11"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "psutil>=5.9",
    "pywin32>=306",
    "pillow>=10.3",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "mss>=9.0.1",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0.3", "piper-tts>=1.8.0", "onnxruntime>=1.18"]
build = ["pyinstaller>=6.6"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pyflakes>=3.2"]

[project.scripts]
martin = "martin.__main__:main"

[tool.setuptools]
packages = ["martin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testy vyžadující běžící Ollama nebo systém",
    "adversarial: adversariální bezpečnostní testy",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"